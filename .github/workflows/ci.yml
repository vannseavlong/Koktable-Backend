name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # Non-blocking: transitive advisories with no available fix shouldn't fail CI on
      # every PR. Surfaced in the job log for manual review instead of gating merges.
      - run: pnpm audit --audit-level=high
        continue-on-error: true
